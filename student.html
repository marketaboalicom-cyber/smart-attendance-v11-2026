<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حضور الطالب</title>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-body: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f2937;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --input-bg: #0b0f19;
            --input-border: #374151;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 10px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 440px; width: 100%; background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--card-border); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        header { text-align: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--card-border); }
        header h1 { font-size: 16px; color: #38bdf8; margin-bottom: 2px; }
        header p { color: var(--text-muted); font-size: 11px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 11px; color: #d1d5db; }
        input, select { width: 100%; padding: 9px; border: 1px solid var(--input-border); border-radius: 6px; font-size: 12px; background-color: var(--input-bg); color: var(--text-main); }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .btn { background: var(--primary); color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 12px; font-weight: 600; transition: 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: #374151; cursor: not-allowed; opacity: 0.7; }
        .btn-success { background: var(--success); }
        .hidden { display: none !important; }
        .status-badge { display: block; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-bottom: 12px; text-align: center; }
        .status-open { background: rgba(5,150,105,0.2); color: #34d399; border: 1px solid #059669; }
        .status-closed { background: rgba(220,38,38,0.2); color: #f87171; border: 1px solid #dc2626; }
        .alert { padding: 8px; border-radius: 6px; margin-bottom: 10px; font-size: 11px; }
        .alert-info { background: rgba(56,189,248,0.1); color: #38bdf8; border: 1px solid #38bdf8; }
        .alert-success { background: rgba(5,150,105,0.2); color: #34d399; border: 1px solid #059669; }
        .alert-danger { background: rgba(220,38,38,0.2); color: #f87171; border: 1px solid #dc2626; }
        .highlight-text { color: #38bdf8; font-size: 13px; font-weight: bold; }
        .row { display: flex; gap: 6px; }
        .row > div { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>نظام تسجيل الحضور الذكي</h1>
        <p>كلية التربية الرياضية - شبين الكوم</p>
    </header>

    <div id="studentSection">
        <div id="sessionStatusBadge" class="status-badge status-closed">جاري الاتصال بالنظام...</div>

        <div id="deviceLockedAlert" class="alert alert-danger hidden" style="text-align: center;">
            ⛔ تم تسجيل الحضور مسبقاً من هذا الجهاز لهذه المادة اليوم.
        </div>

        <form id="attendanceForm">
            <div class="form-group">
                <label>اختر المادة الدراسية:</label>
                <select id="studentSubject">
                    <option value="مصارعة">مصارعة</option>
                    <option value="سباحة">سباحة</option>
                    <option value="تغذية">تغذية</option>
                    <option value="تمرينات">تمرينات</option>
                </select>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>الفرقة:</label>
                    <select id="studentGrade">
                        <option value="الأولى">الأولى</option>
                        <option value="الثانية">الثانية</option>
                        <option value="الثالثة" selected>الثالثة</option>
                        <option value="الرابعة">الرابعة</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الشعبة:</label>
                    <select id="studentDept">
                        <option value="إدارة رياضية" selected>إدارة رياضية</option>
                        <option value="تدريب رياضي">تدريب رياضي</option>
                        <option value="تدريس">تدريس</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>النوع:</label>
                    <select id="studentGender">
                        <option value="بنين" selected>بنين</option>
                        <option value="بنات">بنات</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>الرقم الأكاديمي:</label>
                <input type="number" id="academicIdInput" placeholder="أدخل رقمك الأكاديمي" required>
            </div>

            <div class="form-group">
                <label style="color: #fbbf24;">كود المحاضرة (OTP):</label>
                <input type="text" id="sessionCodeInput" placeholder="أدخل الكود المعلن من الدكتور" required>
            </div>

            <div id="nameConfirmBox" class="alert alert-info hidden">
                أهلاً بك: <span id="confirmedStudentName" class="highlight-text">-</span>
                <div style="font-size: 10px; margin-top: 4px; color: #9ca3af;" id="confirmedStudentInfo"></div>
                <div id="alreadyRegisteredNotice" class="hidden" style="margin-top: 4px; color: #f87171; font-weight: bold;">⚠️ أنت مسجل حضور مسبقاً بالفعل!</div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-success" style="margin-top: 5px;">تسجيل الحضور 🚀</button>
        </form>

        <div id="studentMsg" style="margin-top: 8px;"></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://menoufia-attendance-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let activeStudentMatch = null;
    let validationTimer = null;
    let currentSessionListener = null;

    function getTodayString() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getSessionKey() {
        const subject = document.getElementById("studentSubject").value;
        const grade = document.getElementById("studentGrade").value;
        const dept = (grade === "الثالثة") ? document.getElementById("studentDept").value : "عام";
        const gender = document.getElementById("studentGender").value;
        return `${subject}_${grade}_${dept}_${gender}`.replace(/\s+/g, '_');
    }

    document.addEventListener("DOMContentLoaded", () => {
        checkDeviceLock();
        setupSessionListener();
        validateStudent();

        document.getElementById("studentSubject").addEventListener("change", () => {
            setupSessionListener();
            checkDeviceLock();
            validateStudent();
        });
        document.getElementById("studentGrade").addEventListener("change", () => {
            setupSessionListener();
            validateStudent();
        });
        document.getElementById("studentDept").addEventListener("change", () => {
            setupSessionListener();
            validateStudent();
        });
        document.getElementById("studentGender").addEventListener("change", () => {
            setupSessionListener();
            validateStudent();
        });

        document.getElementById("academicIdInput").addEventListener("input", () => {
            clearTimeout(validationTimer);
            validationTimer = setTimeout(validateStudent, 300);
        });

        document.getElementById("attendanceForm").addEventListener("submit", handleAttendanceSubmit);
    });

    function setupSessionListener() {
        const subject = document.getElementById("studentSubject").value;
        const sessionKey = getSessionKey();
        const badge = document.getElementById("sessionStatusBadge");

        if (currentSessionListener) {
            currentSessionListener.off();
        }

        currentSessionListener = db.ref(`sessions/${sessionKey}`);
        currentSessionListener.on("value", snap => {
            const session = snap.val() || {};
            if (session.isOpen) {
                badge.className = "status-badge status-open";
                badge.innerText = `🟢 التسجيل مفتوح لهذه الفئة (${subject})`;
            } else {
                badge.className = "status-badge status-closed";
                badge.innerText = `🔴 الجلسة مغلقة لهذه الفئة حالياً`;
            }
        });
    }

    function checkDeviceLock() {
        let devId = localStorage.getItem("device_locked_id");
        if (!devId) {
            devId = "dev_" + Math.random().toString(36).substring(2);
            localStorage.setItem("device_locked_id", devId);
        }

        const subject = document.getElementById("studentSubject").value;
        const today = getTodayString();
        const submitBtn = document.getElementById("submitBtn");
        const lockedAlert = document.getElementById("deviceLockedAlert");

        db.ref(`deviceLocks/${devId}/${subject}/${today}`).once("value").then(snap => {
            if (snap.exists()) {
                lockedAlert.classList.remove("hidden");
                submitBtn.disabled = true;
            } else {
                lockedAlert.classList.add("hidden");
                submitBtn.disabled = false;
            }
        });
    }

    // التحقق من أن الطالب ينتمي فعلاً للفرقة والشعبة والنوع المختارين
    function validateStudent() {
        const subject = document.getElementById("studentSubject").value;
        const selectedGrade = document.getElementById("studentGrade").value;
        const selectedDept = (selectedGrade === "الثالثة") ? document.getElementById("studentDept").value : "عام";
        const selectedGender = document.getElementById("studentGender").value;
        
        const acId = document.getElementById("academicIdInput").value.trim();
        const confirmBox = document.getElementById("nameConfirmBox");
        const nameSpan = document.getElementById("confirmedStudentName");
        const infoDiv = document.getElementById("confirmedStudentInfo");
        const notice = document.getElementById("alreadyRegisteredNotice");

        if (!acId) {
            confirmBox.classList.add("hidden");
            activeStudentMatch = null;
            return;
        }

        db.ref(`students/${subject}/${acId}`).once("value").then(snap => {
            const student = snap.val();
            confirmBox.classList.remove("hidden");

            if (student) {
                // مطابقة البيانات المختار مع بيانات الطالب المسجلة في الكشف
                if (student.grade !== selectedGrade || student.dept !== selectedDept || student.gender !== selectedGender) {
                    activeStudentMatch = null;
                    nameSpan.textContent = "❌ بيانات الفئة أو الشعبة أو النوع غير مطابقة!";
                    infoDiv.textContent = `هذا الطالب مسجل في: الفرقة (${student.grade}) - الشعبة (${student.dept}) - النوع (${student.gender})`;
                    notice.classList.add("hidden");
                    return;
                }

                activeStudentMatch = student;
                nameSpan.textContent = student.name;
                infoDiv.textContent = `الفرقة: ${student.grade} | الشعبة: ${student.dept} | كشف رقم (${student.sheetNum}) - مسلسل (${student.localId})`;

                db.ref(`attendance_records/${subject}/${acId}`).once("value").then(recSnap => {
                    if (recSnap.exists()) {
                        notice.classList.remove("hidden");
                    } else {
                        notice.classList.add("hidden");
                    }
                });
            } else {
                activeStudentMatch = null;
                nameSpan.textContent = "❌ رقم أكاديمي غير مسجل لهذه المادة";
                infoDiv.textContent = "تأكد من الرقم أو راجع إدارة الكشوفات.";
                notice.classList.add("hidden");
            }
        });
    }

    function handleAttendanceSubmit(e) {
        e.preventDefault();
        const subject = document.getElementById("studentSubject").value;
        const sessionKey = getSessionKey();
        const inputCode = document.getElementById("sessionCodeInput").value.trim();
        const acId = document.getElementById("academicIdInput").value.trim();
        const submitBtn = document.getElementById("submitBtn");
        const msgEl = document.getElementById("studentMsg");

        if (!activeStudentMatch) {
            alert("الرجاء التأكد من صحة الرقم الأكاديمي ومطابقة الفئة والشعبة.");
            return;
        }

        submitBtn.disabled = true;

        db.ref(`sessions/${sessionKey}`).once("value").then(snap => {
            const session = snap.val() || {};
            if (!session.isOpen) throw new Error("عذراً، جلسة الحضور مغلقة لهذه الفئة حالياً.");
            if (session.code && session.code !== inputCode) throw new Error("❌ كود المحاضرة (OTP) غير صحيح!");

            const devId = localStorage.getItem("device_locked_id");
            const today = getTodayString();
            const timeNow = new Date().toLocaleString("ar-EG");

            return db.ref(`attendance_records/${subject}/${acId}`).transaction(current => {
                if (current !== null) return;
                return {
                    ...activeStudentMatch,
                    status: "حاضر",
                    timestamp: timeNow
                };
            }).then(result => {
                if (!result.committed) throw new Error("⚠️ أنت مسجل حضور مسبقاً بالفعل في هذه المادة!");

                return db.ref(`deviceLocks/${devId}/${subject}/${today}`).set(true);
            });
        }).then(() => {
            msgEl.innerHTML = `<div class="alert alert-success">✅ تم تسجيل حضورك بنجاح يا ${activeStudentMatch.name} (كشف ${activeStudentMatch.sheetNum})</div>`;
            document.getElementById("deviceLockedAlert").classList.remove("hidden");
            submitBtn.disabled = true;
        }).catch(err => {
            msgEl.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
            submitBtn.disabled = false;
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - إدارة الكشوفات والحضور</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-body: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f2937;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --input-bg: #0b0f19;
            --input-border: #374151;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 10px; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--card-border); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        header { text-align: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--card-border); }
        header h1 { font-size: 18px; color: #38bdf8; margin-bottom: 2px; }
        header p { color: var(--text-muted); font-size: 11px; }
        .login-card { max-width: 320px; margin: 30px auto; background: #111827; padding: 15px; border-radius: 10px; border: 1px solid var(--card-border); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .section-title { color: #38bdf8; font-size: 13px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 11px; color: #d1d5db; }
        input, select { width: 100%; padding: 8px; border: 1px solid var(--input-border); border-radius: 6px; font-size: 12px; background-color: var(--input-bg); color: var(--text-main); }
        .btn { background: var(--primary); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 12px; font-weight: 600; }
        .btn:hover { background: var(--primary-hover); }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); color: #0b0f19; }
        .btn-blue { background: #2563eb; }
        .btn-sm { padding: 4px 8px; font-size: 10px; width: auto; display: inline-block; }
        .hidden { display: none !important; }
        .status-badge { display: block; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-bottom: 12px; text-align: center; }
        .status-open { background: rgba(5,150,105,0.2); color: #34d399; border: 1px solid #059669; }
        .status-closed { background: rgba(220,38,38,0.2); color: #f87171; border: 1px solid #dc2626; }
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
        .stat-card { background: #0b0f19; padding: 10px; border-radius: 8px; border: 1px solid var(--card-border); text-align: center; }
        .stat-card h5 { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
        .stat-card .stat-value { font-size: 14px; font-weight: bold; color: #38bdf8; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 11px; }
        th, td { border: 1px solid var(--card-border); padding: 6px; text-align: center; }
        th { background: #0b0f19; color: #38bdf8; }
        .row { display: flex; gap: 6px; }
        .row > div { flex: 1; }
        .doctor-filter-card { background: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid var(--card-border); margin-bottom: 12px; }
        .table-wrapper { overflow-x: auto; max-height: 350px; }
        .blue-text { color: #38bdf8; font-weight: bold; }
        .text-green { color: #34d399; }
        .text-yellow { color: #fbbf24; }
        .sheet-control-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 8px; border-radius: 6px; margin-bottom: 8px; }
        .sheets-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
        .sheet-tab { background: #1f2937; border: 1px solid #374151; color: #fff; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .sheet-tab.active { background: var(--primary); border-color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>لوحة تحكم الإدارة الشاملة</h1>
        <p>كلية التربية الرياضية - شبين الكوم</p>
    </header>

    <div id="adminLoginSection" class="login-card">
        <h3 class="section-title mb-10" style="text-align: center; margin-bottom: 10px;">تسجيل الدخول</h3>
        <div class="form-group">
            <label>اسم المستخدم:</label>
            <input type="text" id="loginUser" placeholder="admin">
        </div>
        <div class="form-group">
            <label>كلمة المرور:</label>
            <input type="password" id="loginPass" placeholder="12345">
        </div>
        <button onclick="handleAdminLogin()" class="btn btn-success" style="margin-top: 5px;">دخول</button>
    </div>

    <div id="adminDashboardSection" class="hidden">
        <div class="header-flex">
            <h3 class="section-title">إدارة الكشوفات (سعة الكشف الواحد 30 طالباً)</h3>
            <button onclick="logoutAdmin()" class="btn btn-danger btn-sm">تسجيل الخروج</button>
        </div>

        <div class="doctor-filter-card">
            <div class="row" style="margin-bottom: 6px;">
                <div class="form-group mb-0">
                    <label style="color: #38bdf8; font-size: 11px;">اختر المادة:</label>
                    <select id="doctorSubject">
                        <option value="مصارعة">مصارعة</option>
                        <option value="سباحة">سباحة</option>
                        <option value="تغذية">تغذية</option>
                        <option value="تمرينات">تمرينات</option>
                    </select>
                </div>
                <div class="form-group mb-0">
                    <label style="color: #fbbf24; font-size: 11px;">كود المحاضرة (OTP):</label>
                    <div style="display: flex; gap: 4px;">
                        <input type="text" id="doctorSessionCode" placeholder="الكود" style="text-align: center; font-weight: bold; color: #38bdf8;">
                        <button onclick="saveSessionCode()" class="btn btn-sm btn-success" style="width: auto;">حفظ وتنشيط</button>
                    </div>
                </div>
            </div>
            <div class="row" style="margin-top: 5px;">
                <div class="form-group mb-0">
                    <label style="color: #38bdf8; font-size: 11px;">الفرقة:</label>
                    <select id="doctorGrade">
                        <option value="الأولى">الأولى</option>
                        <option value="الثانية">الثانية</option>
                        <option value="الثالثة" selected>الثالثة</option>
                        <option value="الرابعة">الرابعة</option>
                    </select>
                </div>
                <div class="form-group mb-0">
                    <label style="color: #38bdf8; font-size: 11px;">الشعبة:</label>
                    <select id="doctorDept">
                        <option value="إدارة رياضية" selected>إدارة رياضية</option>
                        <option value="تدريب رياضي">تدريب رياضي</option>
                        <option value="تدريس">تدريس</option>
                    </select>
                </div>
                <div class="form-group mb-0">
                    <label style="color: #38bdf8; font-size: 11px;">النوع:</label>
                    <select id="doctorGender">
                        <option value="بنين" selected>بنين</option>
                        <option value="بنات">بنات</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="doctorStatusBanner" class="status-badge status-closed">حالة الجلسة...</div>

        <div class="stats-container">
            <div class="stat-card">
                <h5>إجمالي الحضور</h5>
                <div class="stat-value" id="totalAttCount">0 / 0</div>
            </div>
            <div class="stat-card">
                <h5>النسبة المئوية</h5>
                <div class="stat-value text-green" id="totalAttPercent">0%</div>
            </div>
        </div>

        <div class="row" style="margin-bottom: 10px;">
            <button onclick="toggleGlobalSession(true)" class="btn btn-success">فتح التسجيل للفرقة المحددة 🟢</button>
            <button onclick="toggleGlobalSession(false)" class="btn btn-danger">إغلاق التسجيل للفرقة المحددة 🔴</button>
        </div>

        <div style="border: 1px dashed var(--input-border); background: #0b0f19; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 10px;">
            <label for="fileUpload" style="background: var(--primary); color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; display: inline-block;">
                📂 استيراد كشف Excel (تحديد رقم الكشف يدوياً - أقصى سعة 30 طالباً)
            </label>
            <input type="file" id="fileUpload" accept=".xlsx, .xls, .csv" class="hidden">
            <div id="fileUploadStatus" style="margin-top: 4px; font-size: 10px; font-weight: bold; color: #34d399;"></div>
        </div>

        <div style="background: #1e293b; padding: 8px; border-radius: 6px; margin-bottom: 8px;">
            <div style="font-size: 11px; color: #38bdf8; margin-bottom: 4px; font-weight: bold;">اختر الكشف للعرض:</div>
            <div id="sheetsTabsContainer" class="sheets-tabs"></div>
        </div>

        <div class="sheet-control-bar" id="currentSheetActionsBar" style="display: none;">
            <div style="font-size: 11px; color: #fbbf24;" id="currentSheetTitleInfo">الكشف الحالي</div>
            <div style="display: flex; gap: 4px;">
                <button onclick="deleteCurrentActiveSheet()" class="btn btn-danger btn-sm">🗑️ حذف هذا الكشف بالكامل</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="rosterTable">
                <thead>
                    <tr>
                        <th>مسلسل</th>
                        <th>رقم الكشف</th>
                        <th>الرقم الأكاديمي</th>
                        <th>اسم الطالب(ة)</th>
                        <th>المادة</th>
                        <th>الحالة</th>
                        <th>الوقت</th>
                        <th>إجراءات التعديل</th>
                    </tr>
                </thead>
                <tbody id="rosterTbody"></tbody>
            </table>
        </div>

        <div class="row" style="margin-top: 10px;">
            <button onclick="exportToExcel()" class="btn btn-blue">تصدير التقرير إلى Excel 📊</button>
            <button onclick="startNewSessionAndReset()" class="btn btn-danger">تصفير الحضور لهذه الفرقة 🔄</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://menoufia-attendance-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let loadedStudentsGlobal = {};
    let loadedRecordsGlobal = {};
    let activeSelectedSheet = null;
    let currentListeners = [];

    function getTodayString() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // دالة لتوليد مفتاح فريد خاص بالمادة + الفرقة + الشعبة + النوع
    function getSessionKey() {
        const subject = document.getElementById("doctorSubject").value;
        const grade = document.getElementById("doctorGrade").value;
        const dept = (grade === "الثالثة") ? document.getElementById("doctorDept").value : "عام";
        const gender = document.getElementById("doctorGender").value;
        // استبدال المسافات لضمان عدم حدوث مشاكل في مسارات قاعدة البيانات
        return `${subject}_${grade}_${dept}_${gender}`.replace(/\s+/g, '_');
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("doctorSubject").addEventListener("change", setupRealtimeListeners);
        document.getElementById("doctorGrade").addEventListener("change", setupRealtimeListeners);
        document.getElementById("doctorDept").addEventListener("change", setupRealtimeListeners);
        document.getElementById("doctorGender").addEventListener("change", setupRealtimeListeners);
        document.getElementById("fileUpload").addEventListener("change", handleExcelUpload);
    });

    function handleAdminLogin() {
        const u = document.getElementById("loginUser").value.trim();
        const p = document.getElementById("loginPass").value.trim();
        if(u === "admin" && p === "12345") {
            document.getElementById("adminLoginSection").classList.add("hidden");
            document.getElementById("adminDashboardSection").classList.remove("hidden");
            setupRealtimeListeners();
        } else {
            alert("بيانات الدخول غير صحيحة!");
        }
    }

    function logoutAdmin() {
        document.getElementById("adminDashboardSection").classList.add("hidden");
        document.getElementById("adminLoginSection").classList.remove("hidden");
    }

    function setupRealtimeListeners() {
        const subject = document.getElementById("doctorSubject").value;
        const sessionKey = getSessionKey();

        currentListeners.forEach(ref => ref.off());
        currentListeners = [];

        const sessionRef = db.ref(`sessions/${sessionKey}`);
        const studentsRef = db.ref(`students/${subject}`);
        const recordsRef = db.ref(`attendance_records/${subject}`);

        currentListeners.push(sessionRef, studentsRef, recordsRef);

        sessionRef.on("value", snap => {
            const session = snap.val() || {};
            const banner = document.getElementById("doctorStatusBanner");
            const codeInput = document.getElementById("doctorSessionCode");
            if(codeInput && session.code !== undefined) codeInput.value = session.code;
            if(banner) {
                banner.className = session.isOpen ? "status-badge status-open" : "status-badge status-closed";
                banner.innerText = session.isOpen ? `🟢 الجلسة مفتوحة لهذه الفرقة والشعبة` : `🔴 الجلسة مغلقة لهذه الفرقة والشعبة`;
            }
        });

        studentsRef.on("value", snap => {
            loadedStudentsGlobal = snap.val() || {};
            renderSheetsTabsAndTable();
        });

        recordsRef.on("value", snap => {
            loadedRecordsGlobal = snap.val() || {};
            renderSheetsTabsAndTable();
        });
    }

    function renderSheetsTabsAndTable() {
        const grade = document.getElementById("doctorGrade").value;
        const dept = document.getElementById("doctorDept").value;
        const gender = document.getElementById("doctorGender").value;

        const filtered = Object.values(loadedStudentsGlobal).filter(st => 
            st.grade === grade && (grade === "الثالثة" ? st.dept === dept : true) && st.gender === gender
        );

        let sheetsSet = new Set();
        filtered.forEach(st => sheetsSet.add(String(st.sheetNum || "1")));
        let sheetsList = Array.from(sheetsSet).sort((a,b) => Number(a)-Number(b));

        if (sheetsList.length > 0 && (!activeSelectedSheet || !sheetsList.includes(activeSelectedSheet))) {
            activeSelectedSheet = sheetsList[0];
        } else if (sheetsList.length === 0) {
            activeSelectedSheet = null;
        }

        const tabsContainer = document.getElementById("sheetsTabsContainer");
        tabsContainer.innerHTML = "";

        if (sheetsList.length === 0) {
            tabsContainer.innerHTML = `<span style="font-size: 11px; color: #9ca3af;">لا توجد كشوفات مرفوعة لهذه الفئة بعد. يرجى استيراد كشف جديد.</span>`;
            document.getElementById("currentSheetActionsBar").style.display = "none";
            document.getElementById("rosterTbody").innerHTML = "";
            document.getElementById("totalAttCount").innerText = "0 / 0";
            document.getElementById("totalAttPercent").innerText = "0%";
            return;
        }

        sheetsList.forEach(sNum => {
            let countInSheet = filtered.filter(st => String(st.sheetNum) === String(sNum)).length;
            tabsContainer.innerHTML += `<button class="sheet-tab ${activeSelectedSheet === sNum ? 'active' : ''}" onclick="selectSheet('${sNum}')">كشف (${sNum}) - (${countInSheet}/30 طالب)</button>`;
        });

        const actionsBar = document.getElementById("currentSheetActionsBar");
        if(activeSelectedSheet) {
            actionsBar.style.display = "flex";
            document.getElementById("currentSheetTitleInfo").innerText = `الكشف الحالي المحدد: رقم (${activeSelectedSheet})`;
        } else {
            actionsBar.style.display = "none";
        }

        renderTableContent(filtered);
    }

    function selectSheet(sheetNum) {
        activeSelectedSheet = sheetNum;
        renderSheetsTabsAndTable();
    }

    function renderTableContent(filteredStudents) {
        if (!activeSelectedSheet) return;
        const displayedStudents = filteredStudents.filter(st => String(st.sheetNum) === String(activeSelectedSheet));

        const tbody = document.getElementById("rosterTbody");
        tbody.innerHTML = "";

        let presentCount = 0;

        displayedStudents.forEach((st, idx) => {
            const rec = loadedRecordsGlobal[st.academicId];
            const isPresent = !!rec;
            if(isPresent) presentCount++;

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${st.localId || (idx + 1)}</td>
                <td>كشف (${st.sheetNum || 1})</td>
                <td><span class="blue-text">${st.academicId}</span></td>
                <td style="text-align: right;">${st.name}</td>
                <td>${st.subject}</td>
                <td><span style="color: ${isPresent ? '#34d399' : '#f87171'}; font-weight: bold;">${isPresent ? 'حاضر 🟢' : 'غائب 🔴'}</span></td>
                <td>${isPresent ? rec.timestamp : '-'}</td>
                <td>
                    <div style="display: flex; gap: 4px; justify-content: center;">
                        <button onclick="toggleManualAtt('${st.academicId}', ${isPresent})" class="btn btn-sm ${isPresent ? 'btn-danger' : 'btn-success'}">${isPresent ? 'إلغاء الحضور' : 'تسجيل'}</button>
                        <button onclick="deleteSingleStudent('${st.academicId}')" class="btn btn-sm btn-danger" title="حذف الطالب">🗑️</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById("totalAttCount").innerText = `${presentCount} / ${filteredStudents.length}`;
        document.getElementById("totalAttPercent").innerText = filteredStudents.length > 0 ? Math.round((presentCount / filteredStudents.length) * 100) + "%" : "0%";
    }

    function handleExcelUpload(e) {
        const file = e.target.files[0];
        if(!file) return;

        const targetSheetNum = prompt("أدخل رقم الكشف المراد استيراده إليه (مثلاً: 1 أو 2 أو 3):", "1");
        if(!targetSheetNum) {
            e.target.value = "";
            return;
        }

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                const subject = document.getElementById("doctorSubject").value;
                const grade = document.getElementById("doctorGrade").value;
                const dept = (grade === "الثالثة") ? document.getElementById("doctorDept").value : "عام";
                const gender = document.getElementById("doctorGender").value;

                let parsedList = [];
                let seen = new Set();

                json.forEach(row => {
                    const acId = String(row[0] || "").trim();
                    const name = String(row[1] || "").trim();
                    if(!acId || !name || isNaN(Number(acId)) || seen.has(acId)) return;
                    seen.add(acId);
                    parsedList.push({ academicId: acId, name: name });
                });

                if(parsedList.length > 30) {
                    alert(`عذراً! أقصى سعة للكشف الواحد هي 30 طالباً فقط (الملف يحتوي على ${parsedList.length} طالباً).`);
                    e.target.value = "";
                    return;
                }

                db.ref(`students/${subject}`).once("value").then(snap => {
                    let allStudents = snap.val() || {};
                    let currentInThisSheet = Object.values(allStudents).filter(st => 
                        st.grade === grade && (grade === "الثالثة" ? st.dept === dept : true) && st.gender === gender && String(st.sheetNum) === String(targetSheetNum)
                    );

                    if(currentInThisSheet.length + parsedList.length > 30) {
                        alert(`⚠️ عذراً، الكشف رقم (${targetSheetNum}) يحتوي مسبقاً على (${currentInThisSheet.length}) طلاب. تجاوز الحد الأقصى (30).`);
                        e.target.value = "";
                        return;
                    }

                    let indexCounter = currentInThisSheet.length;
                    parsedList.forEach(item => {
                        indexCounter++;
                        allStudents[item.academicId] = {
                            academicId: item.academicId,
                            name: item.name,
                            subject: subject,
                            grade: grade,
                            dept: dept,
                            gender: gender,
                            sheetNum: String(targetSheetNum),
                            localId: indexCounter
                        };
                    });

                    return db.ref(`students/${subject}`).set(allStudents);
                }).then(() => {
                    document.getElementById("fileUploadStatus").innerText = `✅ تم استيراد الكشف رقم (${targetSheetNum}) بنجاح!`;
                    activeSelectedSheet = targetSheetNum;
                    e.target.value = "";
                });
            } catch(err) {
                alert("حدث خطأ أثناء قراءة ملف الإكسل.");
                e.target.value = "";
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function deleteCurrentActiveSheet() {
        if(!activeSelectedSheet) return;
        if(!confirm(`هل أنت متأكد من حذف الكشف رقم (${activeSelectedSheet}) بالكامل؟`)) return;

        const subject = document.getElementById("doctorSubject").value;
        const grade = document.getElementById("doctorGrade").value;
        const dept = document.getElementById("doctorDept").value;
        const gender = document.getElementById("doctorGender").value;

        let students = { ...loadedStudentsGlobal };
        Object.keys(students).forEach(id => {
            let st = students[id];
            if(st.grade === grade && (grade === "الثالثة" ? st.dept === dept : true) && st.gender === gender && String(st.sheetNum) === String(activeSelectedSheet)) {
                delete students[id];
            }
        });

        db.ref(`students/${subject}`).set(students).then(() => {
            alert(`تم حذف الكشف رقم (${activeSelectedSheet}) بنجاح.`);
            activeSelectedSheet = null;
        });
    }

    function deleteSingleStudent(academicId) {
        if(!confirm("هل أنت متأكد من حذف هذا الطالب من الكشف؟")) return;
        const subject = document.getElementById("doctorSubject").value;
        db.ref(`students/${subject}/${academicId}`).remove().then(() => {
            db.ref(`attendance_records/${subject}/${academicId}`).remove();
        });
    }

    function toggleManualAtt(academicId, isPresent) {
        const subject = document.getElementById("doctorSubject").value;
        if(isPresent) {
            db.ref(`attendance_records/${subject}/${academicId}`).remove();
        } else {
            const st = loadedStudentsGlobal[academicId];
            if(st) {
                db.ref(`attendance_records/${subject}/${academicId}`).set({
                    ...st,
                    status: "حاضر",
                    timestamp: new Date().toLocaleString("ar-EG")
                });
            }
        }
    }

    function toggleGlobalSession(isOpen) {
        const sessionKey = getSessionKey();
        db.ref(`sessions/${sessionKey}`).update({ isOpen: isOpen, sessionKey: sessionKey }).then(() => {
            alert(isOpen ? "تم فتح الجلسة لهذه الفرقة والشعبة 🟢" : "تم إغلاق الجلسة لهذه الفرقة والشعبة 🔴");
        });
    }

    function saveSessionCode() {
        const sessionKey = getSessionKey();
        const code = document.getElementById("doctorSessionCode").value.trim();
        db.ref(`sessions/${sessionKey}`).update({ code: code, isOpen: true, sessionKey: sessionKey }).then(() => {
            alert("تم حفظ كود المحاضرة وتنشيطها للفرقة المحددة 🔑");
        });
    }

    function exportToExcel() {
        const subject = document.getElementById("doctorSubject").value;
        let data = [["مسلسل", "رقم الكشف", "الرقم الأكاديمي", "اسم الطالب", "المادة", "الحالة", "الوقت"]];
        
        Object.values(loadedStudentsGlobal).forEach(st => {
            const rec = loadedRecordsGlobal[st.academicId];
            data.push([st.localId, `كشف ${st.sheetNum}`, st.academicId, st.name, st.subject, rec ? "حاضر" : "غائب", rec ? rec.timestamp : "-"]);
        });

        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "الحضور");
        XLSX.writeFile(wb, `حضور_${subject}.xlsx`);
    }

    function startNewSessionAndReset() {
        const subject = document.getElementById("doctorSubject").value;
        if(confirm("هل أنت متأكد من تصفير الحضور وفك الحظر عن الأجهزة لهذه المادة والفئة؟")) {
            const today = getTodayString();
            const updates = {};
            updates[`attendance_records/${subject}`] = null;

            db.ref("deviceLocks").once("value").then(snap => {
                const locks = snap.val() || {};
                Object.keys(locks).forEach(devId => {
                    if (locks[devId] && locks[devId][subject]) {
                        updates[`deviceLocks/${devId}/${subject}`] = null;
                    }
                });
                return db.ref().update(updates);
            }).then(() => {
                alert("تم تصفير الحضور وفك الحظر بنجاح! 🔓");
            }).catch(err => {
                console.error(err);
                alert("حدث خطأ أثناء التصفير.");
            });
        }
    }
</script>
